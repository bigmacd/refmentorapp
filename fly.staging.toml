# Staging Fly.io config for branch / feature testing.
# Deploy with: fly deploy -c fly.staging.toml --image-label staging-$(git rev-parse --short HEAD)
#
# One-time setup:
#   fly volumes create data_cache --app staging-refmentor-931 --region iad --size 1
#   fly secrets set -a staging-refmentor-931 db_url=... STORAGE_SECRET=... ...
#
# The app reads the cache on the data_cache volume. Sync is not started here;
# upload a local sync with tools/pushCacheToFly.sh -c fly.staging.toml.

app = 'staging-refmentor-931'
primary_region = 'iad'

[build]

[env]
  DATA_CACHE_DIR = '/data/cache'
  ALLOW_LIVE_FETCH = 'false'
  SYNC_INTERVAL_HOURS = '2'
  APP_BASE_URL = 'https://staging-refmentor-931.fly.dev'

[processes]
  app = "python3 newMain.py"

[http_service]
  internal_port = 443
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'data_cache'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']
