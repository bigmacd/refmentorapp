# Demo Fly.io config: shared demo/demo login, SQLite restored from the image on every start.
# Deploy with: fly deploy -c fly.demo.toml --image-label demo-$(git rev-parse --short HEAD)
#
# The baseline is demo/refmentor.sqlite in this repo (gitignored). Dockerfile.demo copies it
# into the image. Each time the machine starts, that file replaces /data/refmentor.sqlite,
# so reports a visitor added are gone. The machine stops when idle, which is the reset.
#
# One-time setup:
#   fly apps create demo-refmentor
#   fly volumes create data_cache --app demo-refmentor --region iad --size 1
#   fly secrets set -a demo-refmentor STORAGE_SECRET=...
#
# Do not set production db_url. Do not scale this app above 1 machine (SQLite + volume).
# Keep demo/refmentor.sqlite checkpointed (no leftover WAL) before deploying a new baseline.

app = 'demo-refmentor'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  DB_BACKEND = 'sqlite'
  SQLITE_PATH = '/data/refmentor.sqlite'
  DEMO_MODE = 'true'
  DEMO_BASELINE_PATH = '/app/demo/refmentor.sqlite'
  DATA_CACHE_DIR = '/data/cache'
  ALLOW_LIVE_FETCH = 'false'
  showmentored = 'true'
  APP_BASE_URL = 'https://demo.refmentoring.us/app'

# UI only. Demo data is the snapshot in the image; a sync worker would only add noise.
[processes]
  app = 'python3 newMain.py'

[http_service]
  internal_port = 443
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'data_cache'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  processes = ['app']
