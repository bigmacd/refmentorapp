# fly.toml app configuration file generated for demo-refmentor on 2026-11-01T20:53:26-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'demo-refmentor'
primary_region = 'iad'

[build]
[env]
  ALLOW_LIVE_FETCH = 'false'
  APP_BASE_URL = 'https://demo-refmentor.fly.dev'
  DATA_CACHE_DIR = '/data/cache'
  DB_BACKEND = 'sqlite'
  SQLITE_PATH = '/data/refmentor.sqlite'
  showmentored = 'true'

[processes]
  app = 'python3 newMain.py'

[[mounts]]
  source = 'data_cache'
  destination = '/data'

[http_service]
  internal_port = 443
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
  processes = ['app']
